<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeee9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VESTIAIRE">
  <meta name="description" content="Ton dressing personnel, tes looks et ton studio de tenues. Une PWA locale et gratuite.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./v02.css">
  <title>VESTIAIRE — Dressing & Studio</title>
</head>
<body>
<div id="app" class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-symbol">V<span>.</span></div><div><strong>VESTIAIRE</strong><small>PERSONAL WARDROBE</small></div></div>
    <div class="side-subtitle">MON ESPACE</div>
    <nav class="side-links">
      <button data-nav="home" class="active"><span class="nav-ico">◫</span> Vue d'ensemble</button>
      <button data-nav="wardrobe"><span class="nav-ico">♧</span> Dressing</button>
      <button data-nav="studio"><span class="nav-ico">◈</span> Studio</button>
      <button data-nav="looks"><span class="nav-ico">▦</span> Mes tenues</button>
      <button data-nav="planning"><span class="nav-ico">▤</span> Planning</button>
      <button data-nav="settings"><span class="nav-ico">⚙</span> Réglages</button>
    </nav>
    <div class="side-footer"><span class="status-dot"></span> V0.5 · Local-first<br><small>Données & photos stockées sur ton appareil</small></div>
  </aside>
  <div class="main-column">
    <header class="topbar"><div class="mobile-brand"><span class="brand-symbol">V<span>.</span></span><strong>VESTIAIRE</strong></div><span id="header-label">MON DRESSING</span><button id="header-add" type="button" class="header-add" aria-label="Ajouter un vêtement">＋</button></header>
    <main id="view-root" tabindex="-1"><div class="loading">Ouverture de ton dressing…</div></main>
    <nav class="bottom-nav" aria-label="Navigation">
      <button data-nav="home" class="active"><span>◫</span>Accueil</button>
      <button data-nav="wardrobe"><span>♧</span>Dressing</button>
      <button data-nav="studio"><span>◈</span>Studio</button>
      <button data-nav="looks"><span>▦</span>Tenues</button>
      <button data-nav="planning"><span>▤</span>Planning</button>
      <button data-nav="settings"><span>⚙</span>Réglages</button>
    </nav>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restore-file" accept=".vestiaire,application/octet-stream" hidden>
<input type="file" id="mannequin-file" accept="image/*" hidden>
<input type="file" id="fits-import-file" accept=".json,application/json" hidden>
<script src="./fit-engine.js" defer></script>
<script src="./app.js" defer></script>
<script src="./fits-import.js" defer></script>
</body>
</html>
